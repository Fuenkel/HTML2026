
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button style="color:goldenrod; background-color: lightgray; border-radius:100px" >일본어</button>
    <button style="color:cyan; background-color: lightblue; border-radius:4px;" >영어</button>
    <button style="color:red; background-color: lightcoral;" >중국어</button>

    <!-- 어제 배웠던 문법 넣고, 배경색은 하늘색 글씨색은 빨간색 그리고 강조되는 곳은 strong 태그 글씨색은 황금색 -->
    <p  style = "background-color: skyblue; color: red;">
        어제 배웠던 문법은 <strong style="color: goldenrod;">한마리 두마리는 히키 비키</strong><br>
    </p>

    <p style ="color:cyan; background-color:blue; border-radius:10px; padding:10px;">
        어제 배웠던 것 중에 인상 깊었던 것은 <strong style ="color:greenyellow">html의 태그와 일본에서 옷에 대해서 설명할 때 좀 더 상세하게 말하는 것</strong>이었습니다.
    </p>
</body>
</html>
