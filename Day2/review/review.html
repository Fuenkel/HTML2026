<!-- 1. h1 사용해서 나만의 일본 여행 + 가고싶은 곳 적기-->
<!-- 2. 이미지 태그 사용해서 이미지 넣고, a태그로 여행지 링크 넣기 -->
<!-- 3. iframe 태그 사용해서 해당 지도 넣기 -->
<!-- 4. h3로 일본어 단어장 만들기-->
<!-- 5. input 태그 여러개 사용해서 플레이스 홀더에 어제 배웠던 단어 3개 넣기 -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>키치죠지역</h1>
    <img src="키치죠지역.jpg" alt="키치죠지 역" />
    <img src="KIchijoji.jpg" alt="키치죠지 선데이" />
    <a href="https://matcha-jp.com/ko/6294">키치죠지 링크</a>
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3239.939251512138!2d139.5801608!3d35.703112499999996!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6018ee47f16aa909%3A0xd46a7a747391afaf!2sKichij%C5%8Dji%20Station!5e0!3m2!1sko!2skr!4v1787098523923!5m2!1sko!2skr"
      width="600"
      height="450"
      style="border: 0"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
    <h3>일본어 단어장</h3>
    <input type="text" placeholder="こんにちは" />
    <input type="text" placeholder="ありがとう" />
    <input type="text" placeholder="さようなら" />
  </body>
</html>
