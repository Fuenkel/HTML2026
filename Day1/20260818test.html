<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">

<body>
    <iv>
        <h1>오늘 배운것 헤더 태그에 대해서</h1>      
        <p> 
            1. h1~h6까지 헤더 태그가 존재한다. <br>
            2. h1이 가장 크고 h6이 가장 작다. <br>
        </p>
    </div>

    <div>
        <h1> br 태그에 대해서</h1>
        <p>
            br 태그는 줄바꿈을 위해 사용됩니다.
        </p>
    </div>

    <div>
        <h1> target 속성에 대해서</h1>
        <p> 
            target 속성은 링크를 클릭했을때 새창으로 열리게 하는 속성입니다. <br>
            target="_blank" : 새창으로 열기 <br>
            target="_self" : 현재창에서 열기 <br>
            target="_parent" : 부모창에서 열기 <br>
            target="_top" : 최상위 창에서 열기 <br>
        </p>

        <a href="https://www.google.com" target="_top">구글 바로가기</a>
    </div>

    <div>
        <h1>수업 진행 절차</h1>

    </div>

</body>
