<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../../../setting/reset.css" />
    <link rel="stylesheet" href="root.css" />
    <link rel="stylesheet" href="header.css" />
    <link rel="stylesheet" href="mainTop.css" />
  </head>
  <body>
    <!-- 머릿말 -->
    <header>
      <!-- SQEX 로고 및 선택 시 홈페이지 이동 -->
      <div class="sqex-logo">
        <a href="https://www.jp.square-enix.com/">
          <img src="../img/logo.svg" alt="SQEX 로고" width="310" height="31" />
        </a>
      </div>
      <!-- SQEX 선택 바 및 검색 버튼 -->
      <div class="sqex-select-bar">
        <!-- SQEX 메인 바 -->
        <div class="sqex-main-bar">
          <!--　메인 바 버튼들  -->
          <section class="sqex-main-bar-buttons">
            <div class="sqex-main-bar-button">
              <a href="https://www.jp.square-enix.com/game/"
                ><span>ゲーム</span></a
              >
            </div>
            <div class="sqex-main-bar-button">
              <a href="https://magazine.jp.square-enix.com/top/">
                <span>マガジン＆ブックス</span>
              </a>
            </div>
            <div class="sqex-main-bar-button">
              <a href="https://www.jp.square-enix.com/music/"
                ><span>ミュージック</span></a
              >
            </div>
            <div class="sqex-main-bar-button">
              <a href="https://www.jp.square-enix.com/goods/"
                ><span>グッズ</span></a
              >
            </div>
          </section>
          <!-- 메인 바 검색 기능  -->
          <div class="sqex-main-bar-search">
            <div class="sqex-main-bar-input">
              <input type="text" />
            </div>
            <!-- 메인 바 입력 시 입력 내용 삭제 기능 -->
            <div class="sqex-main-bar-search-button">
              <button class="noShow">X</button>
            </div>
          </div>
        </div>
        <!-- SQEX 서브 바   -->
        <div class="sqex-sub-bar">
          <!-- 서브 바 버튼들 / 왼쪽라인  -->
          <div class="sqex-sub-bar-l">
            <div class="sqex-sub-bar-button">
              <a href="https://store.jp.square-enix.com/"
                ><span>ストア</span></a
              >
            </div>
            <div class="sqex-sub-bar-button">
              <a href="https://member.jp.square-enix.com/"
                ><span>メンバーズ</span></a
              >
            </div>
            <div class="sqex-sub-bar-button">
              <a href="https://www.jp.square-enix.com/presents/"
                ><span>動画</span></a
              >
            </div>
            <div class="sqex-sub-bar-button">
              <a href="https://www.jp.square-enix.com/column/"
                ><span>コラム</span></a
              >
            </div>
          </div>
          <div class="sqex-sub-bar-r">
            <!-- 서브 바 버튼들 / 오른쪽라인  -->

            <div class="sqex-sub-bar-button">
              <a href="https://www.jp.square-enix.com/company/ja/"
                ><span>会社概要</span></a
              >
            </div>
            <div class="sqex-sub-bar-button">
              <a href="https://www.jp.square-enix.com/recruit/"
                ><span>採用情報</span></a
              >
            </div>
          </div>
        </div>
      </div>
    </header>
    <!-- 본문 -->
    <main>
      <!-- 가장 위 -->
      <section class="mainTop">
        <!-- 상단 여백용 (배경의 상단 이미지를 보여주기 위함) -->

        <a href="https://jp.finalfantasy.com/ffx25th" class="bgLink">
          <img src="main_background.jpg" alt="" />
        </a>
        <!-- 이미지 위에 얹어지는 콘텐츠 레이어 -->
        <div class="contentOverlay">
          <article class="specialSite">
            <a href="https://jp.finalfantasy.com/ffx25th">
              <img src="btn_special.png" alt="" />
            </a>
            <p class="mainText">東京ゲームショ2026</p>
          </article>
        </div>
        <div class="contentOverlay">
          <article class="specialSite">
            <a href="https://jp.finalfantasy.com/ffx25th">
              <img src="btn_special.png" alt="" />
            </a>
            <p class="mainText">東京ゲームショ2026</p>
          </article>
        </div>
      </section>
      <section class="bigSquare">
        <img src="main_background.jpg" alt="" />
        <div class="square"></div>
        <div class="square"></div>
      </section>
    </main>
  </body>
</html>
